# RaziOne Eye — frontend nginx config.
# - Serves the Vite SPA (React Router fallback to index.html).
# - Proxies /api/ to the backend compose service (same-origin → no CORS needed).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API → backend container (compose service name `backend`).
  location /api/ {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Hashed Vite assets — cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: React Router handles client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
