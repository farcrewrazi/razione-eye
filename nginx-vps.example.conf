# RaziOne Eye — host Nginx reverse-proxy example (HTTP + Certbot TLS on VPS).
#
# 1. Install nginx + certbot on the host:
#      sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
# 2. Copy this file, set your real domain (2 places: server_name):
#      sudo cp nginx-vps.example.conf /etc/nginx/sites-available/razione-eye
#      sudo nano /etc/nginx/sites-available/razione-eye
# 3. Enable + check + reload:
#      sudo ln -s /etc/nginx/sites-available/razione-eye /etc/nginx/sites-enabled/razione-eye
#      sudo nginx -t && sudo systemctl reload nginx
# 4. Obtain + auto-install the certificate (edits this file to add the 443 block):
#      sudo certbot --nginx -d eye.example.com
# 5. Verify renewal works:
#      sudo certbot renew --dry-run
#
# The compose stack binds the frontend to 127.0.0.1:8080, so Nginx is the
# only public entrypoint. Certbot's systemd timer renews certs automatically.

server {
    listen 80;
    server_name eye.example.com;

    # Frontend container (nginx) serves the SPA + proxies /api/ to the backend.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # LetsEncrypt uploads/backups can be a few MB — allow them through.
    client_max_body_size 10m;
}
